[build-system]
requires = ["uv-build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "melon"
version = "1.0.0-rc.7"
description = "Modular parsers management system."
readme = "README.md"
authors = [
	{ name = "dub1401", email = "vlad.milosta@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
	"beautifulsoup4",
	"dublib>=0.33.0",
	"dulwich>=1.2.6",
	"EbookLib",
	"imagehash",
	"img2pdf",
	"opencv-python-headless",
	"pick",
	"pillow",
	"pydantic-settings",
	"python-dotenv",
	"questionary",
	"uv"
]

[project.optional-dependencies]
dev = ["ruff", "ty", "typos"]

[project.scripts]
melon = "melon:main"
pxm = "melon:main"
urun = "melon:main"
