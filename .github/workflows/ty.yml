name: ty

permissions:
  contents: read

on:
  push:
    paths:
      - src/**
  pull_request:
    paths:
      - src/**

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-extras --all-groups

      - name: Run ty
        run: uv run ty check .
